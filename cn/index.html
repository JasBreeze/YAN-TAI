<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>洗衣液产品展示</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            color: #333;
            opacity: 0;
            transition: opacity 0.8s ease;
        }

        body.loaded {
            opacity: 1;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            animation: fadeInDown 1s ease-out;
        }

        h1 {
            font-size: 2.5rem;
            color: #2c3e50;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .subtitle {
            font-size: 1.2rem;
            color: #7f8c8d;
        }

        .product-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px;
            margin: 40px 0;
        }

        .product-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            padding: 30px;
            width: 100%;
            max-width: 800px;
            text-align: center;
            animation: slideInUp 1s ease-out;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .product-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.15);
        }

        .image-placeholder {
            width: 200px;
            height: 300px;
            background: linear-gradient(45deg, #f0f0f0, #e0e0e0);
            border-radius: 10px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .image-placeholder::before {
            content: '洗衣液图片';
            color: #999;
            font-size: 16px;
            text-align: center;
        }

        .image-placeholder::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                to bottom right,
                rgba(255,255,255,0) 0%,
                rgba(255,255,255,0.3) 50%,
                rgba(255,255,255,0) 100%
            );
            transform: rotate(45deg);
            animation: shimmer 2s infinite;
        }

        .product-info h2 {
            font-size: 1.8rem;
            color: #2c3e50;
            margin-bottom: 15px;
        }

        .product-description {
            font-size: 1rem;
            color: #7f8c8d;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }

        .feature-item {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            transition: transform 0.3s ease;
        }

        .feature-item:hover {
            transform: scale(1.05);
        }

        .feature-icon {
            font-size: 2rem;
            color: #3498db;
            margin-bottom: 10px;
        }

        .feature-title {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .feature-desc {
            font-size: 0.9rem;
            color: #7f8c8d;
        }

        .cta-section {
            text-align: center;
            margin: 60px 0;
            animation: fadeIn 1.5s ease-out;
        }

        .cta-button {
            background: linear-gradient(45deg, #3498db, #2980b9);
            color: white;
            padding: 15px 40px;
            border: none;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(52, 152, 219, 0.3);
        }

        .cta-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(52, 152, 219, 0.4);
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes shimmer {
            0% {
                transform: translateX(-100%) rotate(45deg);
            }
            100% {
                transform: translateX(100%) rotate(45deg);
            }
        }

        .testimonial {
            background: white;
            border-radius: 20px;
            padding: 30px;
            margin: 40px 0;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            animation: slideInUp 1s ease-out 0.3s both;
        }

        .testimonial-text {
            font-style: italic;
            font-size: 1.1rem;
            color: #555;
            margin-bottom: 20px;
        }

        .testimonial-author {
            font-weight: bold;
            color: #333;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }
            
            .product-card {
                padding: 20px;
            }
            
            .features {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>洁净如新，呵护每一件衣物</h1>
            <p class="subtitle">专业洗衣液，给您的衣物最温柔的呵护</p>
        </header>

        <section class="product-section">
            <div class="product-card">
                <div class="image-placeholder"></div>
                <div class="product-info">
                    <h2>深层洁净洗衣液</h2>
                    <p class="product-description">
                        采用先进的清洁配方，能够深入纤维底层，有效去除各种顽固污渍，
                        同时保持衣物柔软光泽，温和不刺激，适合全家使用。
                    </p>
                </div>
            </div>

            <div class="features">
                <div class="feature-item">
                    <div class="feature-icon">✨</div>
                    <div class="feature-title">深层洁净</div>
                    <div class="feature-desc">有效去除顽固污渍</div>
                </div>
                <div class="feature-item">
                    <div class="feature-icon">🌸</div>
                    <div class="feature-title">持久留香</div>
                    <div class="feature-desc">自然清新，持久芬芳</div>
                </div>
                <div class="feature-item">
                    <div class="feature-icon">💧</div>
                    <div class="feature-title">温和配方</div>
                    <div class="feature-desc">护衣护色，不伤手</div>
                </div>
                <div class="feature-item">
                    <div class="feature-icon">🌱</div>
                    <div class="feature-title">环保安全</div>
                    <div class="feature-desc">可生物降解，保护环境</div>
                </div>
            </div>
        </section>

        <div class="testimonial">
            <p class="testimonial-text">
                "这款洗衣液真的很棒！不仅洗得干净，而且衣服摸起来特别柔软，
                还有一股淡淡的清香，非常推荐给大家。"
            </p>
            <p class="testimonial-author">— 李女士，忠实用户</p>
        </div>

        <section class="cta-section">
            <button class="cta-button">立即购买</button>
        </section>
    </div>

    <script>
        // 滚动动画效果
        const observerOptions = {
            threshold: 0.1,
            rootMargin: '0px 0px -50px 0px'
        };

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.style.animationPlayState = 'running';
                }
            });
        }, observerOptions);

        // 观察所有需要动画的元素
        document.querySelectorAll('.product-card, .testimonial, .cta-section').forEach(el => {
            el.style.animationPlayState = 'paused';
            observer.observe(el);
        });

        // 页面加载动画
        window.addEventListener('load', function() {
            document.body.classList.add('loaded');
        });

        // 按钮点击效果 - 平滑过渡到详情页
        document.querySelector('.cta-button').addEventListener('click', function() {
            this.style.transform = 'scale(0.95)';
            setTimeout(() => {
                this.style.transform = 'translateY(-3px)';
                // 添加页面过渡效果
                document.body.style.opacity = '0';
                setTimeout(function() {
                    window.location.href = 'product-details.html';
                }, 500);
            }, 150);
        });

        // 图片占位符交互效果
        const imagePlaceholder = document.querySelector('.image-placeholder');
        imagePlaceholder.addEventListener('mouseenter', function() {
            this.style.transform = 'scale(1.05)';
        });

        imagePlaceholder.addEventListener('mouseleave', function() {
            this.style.transform = 'scale(1)';
        });
    </script>
</body>
</html>
